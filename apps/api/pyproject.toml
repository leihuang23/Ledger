[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-api"
version = "0.1.0"
description = "FastAPI backend for the Ledger project."
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.5,<6",
  "fastapi[standard]>=0.115,<1",
  "slowapi>=0.1.9",
  "httpx>=0.28,<1",
  "langfuse>=3,<4",
  "langgraph>=1.0,<2",
  "langsmith>=0.3.13,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.4,<3",
  "pytest>=8,<9",
]

[project.scripts]
seed-saas-data = "app.seed:main"
ingest-knowledge-docs = "app.knowledge.ingestion:main"
run-eval-suite = "app.evals.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "stripe_live: optional live Stripe Test Clock path (requires STRIPE_API_KEY=sk_test_...)",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pin the lint contract to ruff's historical stable default set. Newer ruff
# releases widen the default rule selection (e.g. I001, SIM, DTZ, UP, RUF),
# which would flag pre-existing test code that was written against E4/E7/E9/F.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.knowledge" = ["docs/*.md"]
